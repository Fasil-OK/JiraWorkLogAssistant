name: build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/JiraWorkLogAssistant/JiraWorkLogAssistant.csproj

      - name: Build
        run: dotnet build src/JiraWorkLogAssistant/JiraWorkLogAssistant.csproj -c Release --no-restore
