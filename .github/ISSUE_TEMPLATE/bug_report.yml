name: 🐛 Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I click "Log now", ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note
        2. Select task ABC-123
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: See the installer filename or Settings.
      placeholder: 2.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Logs live at `%LocalAppData%\JiraWorkLogAssistant\logs\`. Paste the relevant lines.
        **Remove any URLs, usernames, or tokens first.**
      render: text
